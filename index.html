    <!-- Tarayıcı, İframe ve Harici Sistem Konsol Temizleyici Kalkanı -->
    <script>
      (function() {
        // 1. "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var originalFetch = window.fetch;
          var fetchHolder = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return fetchHolder; },
            set: function(newFetch) { fetchHolder = newFetch; },
            configurable: true,
            enumerable: true
          });
        } catch (err) {}

        // 2. Unload yetki ihlali engelleyici
        try {
          var origAddEventListener = EventTarget.prototype.addEventListener;
          EventTarget.prototype.addEventListener = function(type, listener, options) {
            if (type === 'unload') {
              return origAddEventListener.call(this, 'pagehide', listener, options);
            }
            return origAddEventListener.call(this, type, listener, options);
          };
        } catch (err) {}

        // 3. Sistem / Harici Platform loglarını ve uyarılarını filtreleme
        var blockedKeywords = [
          'powerPreference',
          'requestAdapter',
          'Origin trial',
          'No ID or name found in config',
          'html2canvas',
          'Tracking Prevention',
          'Duplicate definition of module',
          'preloaded using link preload',
          'writer',
          'rewriter',
          'proofreader',
          'language-model',
          'fetch',
          'unload',
          'Permissions policy'
        ];

        function shouldSuppress(args) {
          var str = '';
          for (var i = 0; i < args.length; i++) {
            try {
              str += ' ' + (typeof args[i] === 'object' ? JSON.stringify(args[i]) : String(args[i]));
            } catch (e) {
              str += ' ' + String(args[i]);
            }
          }
          for (var j = 0; j < blockedKeywords.length; j++) {
            if (str.indexOf(blockedKeywords[j]) !== -1) return true;
          }
          return false;
        }

        var origWarn = console.warn;
        console.warn = function() {
          if (shouldSuppress(arguments)) return;
          origWarn.apply(console, arguments);
        };

        var origError = console.error;
        console.error = function() {
          if (shouldSuppress(arguments)) return;
          origError.apply(console, arguments);
        };

        var origLog = console.log;
        console.log = function() {
          if (shouldSuppress(arguments)) return;
          origLog.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (event.message && shouldSuppress([event.message, event.filename])) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && shouldSuppress([String(event.reason)])) {
            event.preventDefault();
          }
        });
      })();
    </script>
